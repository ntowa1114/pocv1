<!doctype html>
<meta charset = "utf-8">
<title>merchant</title>
<h1>加盟店ページ(localhost:8080)</h1>

<button onclick="payTop()">A.トップから直接送信</button>

<!--iframe型-->
<h3>PSP iframe(127.0.0.1:8081)</h3>
<iframe src="http://127.0.0.1:8081/frame" style="width:340px;height:120px"></iframe>

<script>
    const PAN ='4111111111111111';
    function payTop(){
      console.log("payTop関数が叩かれました");
      fetch('http://localhost:8080/pay', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'cardnumber=' + PAN,
    });
    }

</script>
